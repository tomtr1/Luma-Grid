name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: LumaGridCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Run engine and services tests
        run: swift test --package-path Packages/LumaGridCore

  ios:
    name: iOS build and tests (Simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project LumaGrid.xcodeproj -scheme LumaGrid
      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = [(rt, d) for rt, ds in data.items() if "iOS" in rt for d in ds if d["name"].startswith("iPhone")]
          ios.sort(key=lambda x: x[0])
          print(ios[-1][1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build Release (ads disabled, no credentials)
        run: |
          set -o pipefail
          xcodebuild build -project LumaGrid.xcodeproj -scheme LumaGrid -configuration Release \
            -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || {
            grep -E ": (error|fatal error):" build.log | sort -u | head -n 100 || true
            tail -n 30 build.log
            exit 1
          }
          grep -E ": warning:" build.log | grep -v "/SourcePackages/" | sort -u | head -n 60 || true
          tail -n 5 build.log
      - name: Build simulator app for Appetize.io
        run: |
          set -o pipefail
          xcodebuild build -project LumaGrid.xcodeproj -scheme LumaGrid -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/appetize CODE_SIGNING_ALLOWED=NO > appetize-build.log 2>&1 || { tail -n 40 appetize-build.log; exit 1; }
          cd build/appetize/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent LumaGrid.app "$GITHUB_WORKSPACE/LumaGrid-Simulator.zip"
          ls -la "$GITHUB_WORKSPACE/LumaGrid-Simulator.zip"
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: LumaGrid-Simulator-for-Appetize
          path: LumaGrid-Simulator.zip
      - name: Unit and UI tests (Debug)
        run: |
          set -o pipefail
          xcodebuild test -project LumaGrid.xcodeproj -scheme LumaGrid -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult > test.log 2>&1 || {
            grep -E -A3 "error: |error: -\[" test.log | grep -v "/SourcePackages/" | head -n 150 || true
            grep -iE "test case .* (failed|skipped)|StoreKitIntegrationTests:|Failing tests" -A8 test.log | head -n 80 || true
            tail -n 80 test.log
            exit 1
          }
          grep -iE "test (suite|case) .*(passed|failed|skipped)|executed [0-9]+ test" test.log | tail -n 40 || true
          tail -n 15 test.log
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p screenshots
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots || true
          ls screenshots | head -n 40
      - name: Print crash reports and screenshot previews
        if: always()
        run: |
          for f in screenshots/*.ips; do
            [ -e "$f" ] || continue
            echo "=== CRASH REPORT $f"
            head -c 12000 "$f"; echo
          done
          python3 - <<'PY'
          import json, os, subprocess, base64
          d = "screenshots"
          if os.path.exists(os.path.join(d, "manifest.json")):
              for test in json.load(open(os.path.join(d, "manifest.json"))):
                  for a in test.get("attachments", []):
                      src = os.path.join(d, a["exportedFileName"])
                      if not src.endswith(".png"):
                          continue
                      out = src + ".jpg"
                      subprocess.run(["sips", "-Z", "560", "-s", "format", "jpeg", "-s", "formatOptions", "55", src, "--out", out], capture_output=True)
                      data = base64.b64encode(open(out, "rb").read()).decode()
                      name = a["suggestedHumanReadableName"].split("_0_")[0]
                      print(f"=== SCREENSHOT {name} {len(data)}")
                      print(data)
                      print("=== END SCREENSHOT")
          PY
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: screenshots
          if-no-files-found: ignore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
