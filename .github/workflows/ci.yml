name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: LumaGridCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Run engine and services tests
        run: swift test --package-path Packages/LumaGridCore

  ios:
    name: iOS build and tests (Simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project LumaGrid.xcodeproj -scheme LumaGrid
      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = [(rt, d) for rt, ds in data.items() if "iOS" in rt for d in ds if d["name"].startswith("iPhone")]
          ios.sort(key=lambda x: x[0])
          print(ios[-1][1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build Release (ads disabled, no credentials)
        run: |
          set -o pipefail
          xcodebuild build -project LumaGrid.xcodeproj -scheme LumaGrid -configuration Release \
            -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO | tail -n 40
      - name: Unit and UI tests (Debug)
        run: |
          set -o pipefail
          xcodebuild test -project LumaGrid.xcodeproj -scheme LumaGrid -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult | tail -n 120
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
