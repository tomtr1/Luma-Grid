# XcodeGen spec for LumaGrid. The generated LumaGrid.xcodeproj is committed, so XcodeGen is
# only needed when this file changes:  xcodegen generate
name: LumaGrid
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  LumaGridCore:
    path: Packages/LumaGridCore
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "13.11.0"
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: "3.1.0"

targets:
  LumaGrid:
    type: application
    platform: iOS
    sources:
      - path: LumaGrid
        excludes:
          - "Resources/LumaGrid.storekit"
      - path: LumaGrid/Resources/LumaGrid.storekit
        buildPhase: none
    dependencies:
      - package: LumaGridCore
        product: LumaGridEngine
      - package: LumaGridCore
        product: LumaGridServices
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LUMA_BUNDLE_ID)
        INFOPLIST_FILE: LumaGrid/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        OTHER_LDFLAGS: $(inherited) -ObjC
    preBuildScripts:
      - name: Validate Release Configuration
        script: '"${SRCROOT}/Scripts/validate_release_config.sh"'
        inputFiles:
          - $(SRCROOT)/Scripts/validate_release_config.sh
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed StoreKit Test Configuration (Debug only)
        script: |
          # StoreKit testing (SKTestSession in LumaGridTests) resolves the configuration from the
          # host app bundle as well as the test bundle. Release builds never include it.
          if [ "${CONFIGURATION}" = "Debug" ]; then
            cp "${SCRIPT_INPUT_FILE_0}" "${SCRIPT_OUTPUT_FILE_0}"
          fi
        inputFiles:
          - $(SRCROOT)/LumaGrid/Resources/LumaGrid.storekit
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/LumaGrid.storekit
    scheme:
      testTargets:
        - LumaGridTests
        - LumaGridUITests
      storeKitConfiguration: LumaGrid/Resources/LumaGrid.storekit
      gatherCoverageData: true

  LumaGridTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LumaGridTests
      - path: LumaGrid/Resources/LumaGrid.storekit
        buildPhase: resources
    dependencies:
      - target: LumaGrid
      - package: LumaGridCore
        product: LumaGridEngine
      - package: LumaGridCore
        product: LumaGridServices
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/LumaGrid.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LumaGrid
        BUNDLE_LOADER: $(TEST_HOST)
        PRODUCT_BUNDLE_IDENTIFIER: $(LUMA_BUNDLE_ID).tests

  LumaGridUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LumaGridUITests
    dependencies:
      - target: LumaGrid
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LumaGrid
        PRODUCT_BUNDLE_IDENTIFIER: $(LUMA_BUNDLE_ID).uitests
